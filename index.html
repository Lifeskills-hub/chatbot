<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Studio Web Chat</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --chat-bg: #ffffff;
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --user-msg-bg: #0284c7;
            --user-msg-color: #ffffff;
            --bot-msg-bg: #f1f5f9;
            --bot-msg-color: #0f172a;
            --text-color: #334155;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 650px;
            height: 92vh;
            background: var(--chat-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .chat-header {
            padding: 16px;
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 1.2rem;
            color: #0f172a;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            color: var(--user-msg-color);
            border-bottom-right-radius: 2px;
        }

        .message.assistant {
            align-self: flex-start;
            background-color: var(--bot-msg-bg);
            color: var(--bot-msg-color);
            border-bottom-left-radius: 2px;
        }

        .message.system {
            align-self: center;
            background-color: #fef3c7;
            color: #92400e;
            font-size: 0.85rem;
            border-radius: 6px;
            max-width: 90%;
            text-align: center;
        }

        .chat-input-container {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            background-color: #ffffff;
        }

        .chat-input-container input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            outline: none;
            font-size: 0.95rem;
        }

        .chat-input-container input:focus {
            border-color: var(--primary-color);
        }

        .btn {
            padding: 8px 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <h2>Gemini AI Studio Chat</h2>
        </div>

        <!-- Messages Display Area -->
        <div id="chat-messages" class="chat-messages">
            <div class="message system">Connecting to Gemini AI assistant...</div>
        </div>

        <!-- Input Area -->
        <div class="chat-input-container">
            <input type="text" id="user-input" placeholder="Type a message..." disabled onkeypress="handleKeyPress(event)">
            <button id="send-btn" class="btn" disabled onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Load configuration first (injected dynamically by GitHub Actions during deployment) -->
    <script src="config.js"></script>
    <script>
        // API_KEY is loaded from config.js
        const activeApiKey = typeof API_KEY !== 'undefined' ? API_KEY : '';

        const chatHistory = [];
        let availableModels = [];

        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        window.addEventListener('DOMContentLoaded', () => {
            initApiKey();
        });

        async function initApiKey() {
            if (!activeApiKey) {
                appendSystemMessage("Configuration Error: config.js was not generated or API key is missing.");
                return;
            }

            try {
                // Fetch dynamically available text-generation models for this key
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${activeApiKey}`);
                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error?.message || 'Invalid API key or unauthorized access.');
                }

                availableModels = data.models
                    .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'))
                    .map(m => m.name.replace('models/', ''))
                    .sort((a, b) => {
                        if (a.includes('flash') && !b.includes('flash')) return -1;
                        if (!a.includes('flash') && b.includes('flash')) return 1;
                        return 0;
                    });

                if (availableModels.length === 0) {
                    throw new Error('No compatible content models available for this key.');
                }

                userInput.disabled = false;
                sendBtn.disabled = false;
                appendSystemMessage(`Connected successfully! Ready to chat.`);

            } catch (err) {
                console.error(err);
                appendSystemMessage(`Setup Error: ${err.message}`);
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || availableModels.length === 0) return;

            // Render User Message
            appendMessage('user', text);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            chatHistory.push({
                role: 'user',
                parts: [{ text: text }]
            });

            const assistantMsgEl = createMessageElement('assistant', 'Thinking...');

            let success = false;
            let lastError = '';

            // Try available models sequentially with fallback logic
            for (const model of availableModels) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 12000);

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${activeApiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: chatHistory }),
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);
                    const data = await response.json();

                    if (response.status === 429 || (data.error && data.error.message.toLowerCase().includes('demand'))) {
                        console.warn(`Model ${model} is busy. Trying next model...`);
                        lastError = data.error?.message || 'High demand';
                        continue;
                    }

                    if (!response.ok) {
                        lastError = data.error?.message || `HTTP ${response.status}`;
                        continue;
                    }

                    if (!data.candidates || data.candidates.length === 0) {
                        lastError = 'No response candidates returned.';
                        continue;
                    }

                    const replyText = data.candidates[0].content.parts[0].text;
                    assistantMsgEl.textContent = replyText;

                    chatHistory.push({
                        role: 'model',
                        parts: [{ text: replyText }]
                    });

                    success = true;
                    break;

                } catch (err) {
                    clearTimeout(timeoutId);
                    lastError = err.name === 'AbortError' ? 'Request timed out' : err.message;
                    console.error(`Attempt failed on model ${model}:`, err);
                }
            }

            if (!success) {
                assistantMsgEl.textContent = `Error: Could not reach Gemini. (${lastError})`;
                assistantMsgEl.style.color = '#dc2626';
            }

            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
            scrollToBottom();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function createMessageElement(role, text) {
            const msgEl = document.createElement('div');
            msgEl.className = `message ${role}`;
            msgEl.textContent = text;
            chatMessages.appendChild(msgEl);
            scrollToBottom();
            return msgEl;
        }

        function appendMessage(role, text) {
            createMessageElement(role, text);
        }

        function appendSystemMessage(text) {
            const msgEl = document.createElement('div');
            msgEl.className = 'message system';
            msgEl.textContent = text;
            chatMessages.appendChild(msgEl);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
