name: Deploy Chat App to GitHub Pages

on:
  push:
    branches: [ main ] # Change to 'master' if your repository's default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject API Key into HTML
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('index.html', 'utf8');
            content = content.replace(/__GEMINI_API_KEY__/g, process.env.GEMINI_API_KEY || '');
            fs.writeFileSync('index.html', content);
          "

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
